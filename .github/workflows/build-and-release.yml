name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rattler-build v0.75.0 (official prebuilt binary)
        # x86_64 Linux only ships a static (musl) binary in upstream
        # releases; it is fully static, so it runs on the glibc runner.
        # The produced .conda is built with conda-forge (glibc) toolchains,
        # so the builder's own libc is irrelevant to the artifact.
        run: |
          curl -fsSL -O \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.75.0/rattler-build-x86_64-unknown-linux-musl.tar.gz \
            -O \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.75.0/rattler-build-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c rattler-build-x86_64-unknown-linux-musl.tar.gz.sha256
          mkdir -p "$HOME/rattler"
          tar -xzf rattler-build-x86_64-unknown-linux-musl.tar.gz -C "$HOME/rattler"
          echo "$HOME/rattler" >> "$GITHUB_PATH"
          rattler --version

      - name: Build conda package
        # --test=skip: hosted runners have no NVIDIA driver (libcuda.so.1
        # missing), so the --help smoke test cannot execute. The smoke test
        # is run on real hardware (see feedstock README).
        run: |
          rattler build -r recipe/meta.yaml -c conda-forge --test=skip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="$(ls output/linux-64/*.conda)"
          SHA="$(sha256sum "$PKG" | awk '{print $1}')"
          VER="$(awk '/^  version:/{print $2; exit}' recipe/meta.yaml)"
          {
            echo "# NInfer ${VER} — linux-64 (CI build)"
            echo ""
            echo "Built by GitHub Actions with rattler-build v0.75.0 against conda-forge (glibc toolchain)."
            echo ""
            echo "- Upstream: https://github.com/Neroued/ninfer (commit pinned in recipe/meta.yaml)"
            echo "- Target hardware: NVIDIA GeForce RTX 5090 (sm_120a / Blackwell); CUDA 13.x"
            echo "- Binaries: ninfer (CLI), ninfer-serve (HTTP server, OpenAI/Anthropic-compatible APIs), ninfer-perplexity"
            echo "- Runtime deps (conda-forge): cuda-cudart 13.x, ffmpeg, libcurl, libstdcxx-ng — plus the system NVIDIA driver (provides libcuda.so.1)"
            echo ""
            echo "## Install"
            echo ""
            echo '```'
            echo "# offline-capable"
            echo "conda install --offline ${PKG}"
            echo "micromamba install ${PKG}"
            echo ""
            echo "# smoke test only — no GPU/VRAM needed (on a machine with the NVIDIA driver)"
            echo "ninfer --help"
            echo '```'
            echo ""
            echo "## Artifact"
            echo ""
            echo '```'
            echo "sha256:  ${SHA}"
            echo "package: ${PKG}"
            echo '```'
            echo ""
            echo "Model weights are **not** included. Reproduce from source: see README.md"
            echo "(rattler build -r recipe/meta.yaml -c conda-forge)."
          } > /tmp/release-notes.md
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" "$PKG" --clobber
          else
            # fallback: release may have appeared concurrently (retrigger race)
            gh release create "$VER" \
              --title "NInfer ${VER} (linux-64, RTX 5090 / sm_120a)" \
              --notes-file /tmp/release-notes.md \
              "$PKG" \
              || gh release upload "$VER" "$PKG" --clobber
          fi
