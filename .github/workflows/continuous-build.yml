name: Continuous Build (12h)

# Twice-daily (00:00 + 12:00 UTC) build of the latest NInfer upstream code.
#
# On-time triggering: GitHub's free-tier `schedule` cron proved unreliable
# (2026-09-01: the 00:00 UTC slot started 02:27 UTC, the 12:00 slot
# started 15:42 UTC — 2.5-3.7h of scheduler lag), and the maintainer's
# box is not 24/7, so a local timer can't own the schedule either.
# `workflow_dispatch` runs start within ~1 minute, so the on-time trigger
# is an external cron service (cron-job.org free plan; job spec in
# scripts/ci-cron/README.md) that POSTs to this repo's workflow_dispatch
# API endpoint at :00 UTC sharp. This workflow deliberately has NO
# schedule block — keeping one would double-build ~3h after every on-time
# dispatch.
#
# Each run builds the upstream repo's current state:
#   * source = the default-branch HEAD of Neroued/ninfer at run time
#     (the recipe's source pin is re-pinned in the CI checkout per run;
#     the pin on main is the stable baseline for versioned releases —
#     see README)
#   * if upstream is unchanged since the last successful build, the run
#     skips (green, no release): the channel already carries the latest
#     code, so a rebuild would only publish duplicate assets. "Unchanged"
#     means BOTH inputs: the upstream commit AND this feedstock commit
#     (recipe + CI plumbing) recorded in the newest per-build release's
#     notes — so a recipe change (e.g. a cherry-picked patch pushed to
#     main) forces a rebuild at the next run even if upstream is still
#   * recipe/meta.yaml may carry `source: patches:` entries: upstream
#     commits cherry-picked on top of the source pin while not (yet) on any
#     upstream branch. A commit on no branch is invisible to `git ls-remote
#     HEAD`, so without the patch it could sit unshipped until it lands on
#     a branch (2026-09-05: d8e2a27a, on top of ad0f3d38, on no branch).
#     Each run applies the patch on top of the fetched upstream HEAD; the
#     re-pin step auto-drops the `patches:` lines once the fetched HEAD is
#     the patch's own commit sha (its tarball already carries the change)
#   * tag:   v<YYYY.MM.DD.HHMM>-<upstream-hash7>
#          (upstream-hash7 = first 7 chars of the upstream commit the
#          package was built from — NOT this feedstock repo's commit,
#          whose hash only identifies recipe/CI plumbing; issue #1)
#          (v-prefix: never matches build-and-release.yml's [0-9]* tag
#          filter, so per-build tags can't re-trigger versioned builds)
#   * asset: ninfer-<YYYY.MM.DD.HHMM>-<upstream-hash7>.conda
#          (the recipe's static `build.string` = "<upstream-hash7>" is
#          used verbatim by rattler-build — no auto content-fingerprint
#          tail, no arch suffix — so the filename/`build` field is exactly
#          the upstream commit7)
#   * a twin asset with the constant name `ninfer-latest.conda` (same
#     bytes) is uploaded too, so GitHub's
#     /releases/latest/download/ninfer-latest.conda URL always serves the
#     newest build — the stable *download* URL for scripts (mamba/micromamba
#     install the per-tag real-name asset URL instead: libmamba parses the
#     filename and rejects the two-segment alias with "Missing name in
#     filename"; see README)
# After each run, old per-build releases are pruned (newest 3 kept,
# ~1.4 GB storage cap) and the Pages publish step drops repodata entries
# whose release no longer exists. Versioned releases (build-and-release.yml)
# are pinned, stable, and never pruned.

on:
  # external cron service (scripts/ci-cron/) + manual runs; no schedule
  # block on purpose (see header: free-tier cron lag doubles builds)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream NInfer HEAD
        # the channel tracks upstream: each run builds the default-branch
        # HEAD of Neroued/ninfer at run time. git ls-remote (not the
        # GitHub API): hosted runner IPs are shared and the unauthenticated
        # API rate limit (60/h) would flake a twice-daily job.
        id: upstream
        run: |
          UPSHA="$(git ls-remote https://github.com/Neroued/ninfer HEAD | awk 'NR==1{print $1}')"
          if ! printf '%s' "$UPSHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "Error: unexpected 'git ls-remote' result for Neroued/ninfer: '${UPSHA:-<empty>}'" >&2
            exit 1
          fi
          echo "upsha=${UPSHA}" >> "$GITHUB_OUTPUT"
          echo "upsha7=${UPSHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Skip if upstream unchanged since last successful build
        # the built upstream sha is recorded in the newest per-build
        # release's notes ("NInfer commit: .../commit/<full sha>"), and the
        # feedstock sha that run used ("Feedstock commit: `<full sha>`").
        # Both must match for a skip: a recipe change (cherry-picked patch,
        # dependency bump, ...) changes the built package even when upstream
        # HEAD is unchanged, so it must force a rebuild. Releases without
        # one of those lines (pre-2026-09-04 old format) force a rebuild —
        # the safe direction. If the channel already carries the current
        # upstream HEAD built from the current recipe, this run publishes
        # nothing and finishes green.
        id: skipcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSHA="${{ steps.upstream.outputs.upsha }}"
          LAST="$(gh release list --limit 100 --json tagName \
            | jq -r '.[].tagName' \
            | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}-[0-9a-f]{7}$' \
            | sort | tail -1 || true)"
          if [ -z "$LAST" ]; then
            echo "no per-build releases yet; nothing to skip against"
            exit 0
          fi
          NOTES="$(gh release view "$LAST" --json body --jq .body)"
          PREV="$(printf '%s' "$NOTES" \
            | grep -oE 'commit/[0-9a-f]{40}' | tail -1 | sed 's|^commit/||' || true)"
          FEEDSHA="$(printf '%s' "$NOTES" \
            | grep -oE 'Feedstock commit: `[0-9a-f]{40}`' | grep -oE '[0-9a-f]{40}' | head -1 || true)"
          echo "newest per-build release: ${LAST}; recorded upstream sha: ${PREV:-<none>}; feedstock sha: ${FEEDSHA:-<none>}"
          if [ "$PREV" = "$UPSHA" ] && [ "$FEEDSHA" = "$GITHUB_SHA" ]; then
            echo "SKIP: upstream HEAD (${UPSHA:0:7}) and recipe (feedstock ${GITHUB_SHA:0:7}) unchanged; channel already current"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download rattler-build v0.75.0 (official prebuilt binary)
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        run: |
          curl -fsSL -O \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.75.0/rattler-build-x86_64-unknown-linux-musl.tar.gz \
            -O \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.75.0/rattler-build-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c rattler-build-x86_64-unknown-linux-musl.tar.gz.sha256
          mkdir -p "$HOME/rattler"
          tar -xzf rattler-build-x86_64-unknown-linux-musl.tar.gz -C "$HOME/rattler"
          ln -sf "$HOME/rattler/rattler-build-x86_64-unknown-linux-musl/rattler-build" "$HOME/rattler/rattler"
          echo "$HOME/rattler" >> "$GITHUB_PATH"
          "$HOME/rattler/rattler" --version

      - name: Provision /lib64 (required by prebuilt CUDA 13 libraries)
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        run: |
          sudo mkdir -p /lib64 /usr/lib64
          for f in /lib/x86_64-linux-gnu/*.so*; do
            sudo ln -sf "$f" "/lib64/$(basename "$f")"
          done
          if [ -e /usr/lib/x86_64-linux-gnu/libc_nonshared.a ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libc_nonshared.a /usr/lib64/libc_nonshared.a
          else
            ar rcs /tmp/libc_nonshared.a
            sudo cp /tmp/libc_nonshared.a /usr/lib64/libc_nonshared.a
          fi
          ls -la /lib64/ | head -20

      - name: Repin recipe to upstream HEAD + prepare timestamped version
        # re-pins the recipe source (url + sha256) and the static build
        # string ("<commit7>") to the upstream commit this run
        # builds. meta.yaml on main keeps the stable baseline (versioned
        # releases + local builds); CI rewrites its own checkout only, so
        # the pin in the repo never drifts. The tarball is fetched here to
        # compute the sha256 rattler will verify when it downloads the
        # source. Any recipe `patches:` entries (cherry-picked upstream
        # commits, see recipe/meta.yaml) are kept and applied on top of the
        # fetched HEAD — except when the fetched HEAD is the patch's own
        # commit sha: that tarball already carries the change, so the patch
        # lines are dropped here (otherwise the build fails on an
        # already-applied hunk).
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        id: ver
        run: |
          TS="$(date -u +%Y.%m.%d.%H%M)"
          UPSHA="${{ steps.upstream.outputs.upsha }}"
          curl -fsSL -o /tmp/ninfer-head.tar.gz \
            "https://github.com/Neroued/ninfer/archive/${UPSHA}.tar.gz"
          NEWSHA256="$(sha256sum /tmp/ninfer-head.tar.gz | awk '{print $1}')"
          sed -i "s|archive/[0-9a-f]\{40\}\.tar\.gz|archive/${UPSHA}.tar.gz|" recipe/meta.yaml
          sed -i "s|^    sha256: [0-9a-f]\{64\}$|    sha256: ${NEWSHA256}|" recipe/meta.yaml
          sed -i "s|^  string: .*|  string: \"${UPSHA:0:7}\"|" recipe/meta.yaml
          # cherry-picked-commit lifecycle: when upstream HEAD is a patch's
          # own commit sha, its tarball already contains the change — drop
          # the patch lines (marker comment + `patches:` + entries). Keep
          # this list in sync with recipe/patches/ + recipe/meta.yaml.
          for PATCHSHA in d8e2a27afad57fafe435b2dade8146dce1f7c29c; do
            if [ "$UPSHA" = "$PATCHSHA" ]; then
              sed -i -e '/^    patches:$/d' -e '/^      - patches\//d' \
                     -e '/^    # Patch lifecycle:/d' recipe/meta.yaml
              echo "upstream HEAD ${UPSHA:0:7} already contains recipe patch ${PATCHSHA:0:7}; patch lines dropped (bump the baseline pin on main)"
            fi
          done
          grep -q "archive/${UPSHA}\.tar\.gz" recipe/meta.yaml \
            || { echo "Error: failed to re-pin recipe source url to ${UPSHA}" >&2; exit 1; }
          grep -q "^    sha256: ${NEWSHA256}$" recipe/meta.yaml \
            || { echo "Error: failed to re-pin recipe source sha256" >&2; exit 1; }
          grep -q "^  string: \"${UPSHA:0:7}\"" recipe/meta.yaml \
            || { echo "Error: failed to re-pin recipe build string" >&2; exit 1; }
          # no dashes in the version; the static build string carries the upstream hash + arch
          echo "version=${TS}" >> "$GITHUB_OUTPUT"
          sed -i "s/^  version: .*/  version: ${TS}/" recipe/meta.yaml
          grep -nE 'url:|sha256:|  version:|  string:|patches:' recipe/meta.yaml
          # surface applied recipe patches in the release notes (empty when
          # no patches remain after the lifecycle drop above)
          PATCHNOTE="$(grep -E '^[[:space:]]*- patches/' recipe/meta.yaml \
            | sed 's/^[[:space:]]*- //' | tr '\n' ' ' || true)"
          echo "patchnote=${PATCHNOTE}" >> "$GITHUB_OUTPUT"

      - name: Build conda package
        # the static build.string in recipe/meta.yaml (re-pinned above) is
        # the sole build-string source — no CLI prefix, so rattler's auto
        # content-fingerprint tail is never appended
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        run: |
          rattler build -r recipe/meta.yaml -c conda-forge --test=skip

      - name: Create per-build release (tag = v<version>-<upstream-hash>)
        # one tag + release per build; v-prefix keeps per-build tags away
        # from build-and-release.yml's [0-9]* tag trigger; the hash is the
        # upstream NInfer commit the package was built from (issue #1)
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          UPSHA="${{ steps.upstream.outputs.upsha }}"
          {
            echo "# NInfer ${VER} — linux-64 (sm_120a, continuous build)"
            echo ""
            echo "Continuous build of NInfer @ \`${UPSHA:0:7}\` (RTX 5090 / sm_120a), 12-hour cycle."
            echo ""
            echo "- NInfer commit: https://github.com/Neroued/ninfer/commit/${UPSHA}"
             PATCHNOTE="${{ steps.ver.outputs.patchnote }}"
             if [ -n "$PATCHNOTE" ]; then
               echo "- Recipe patches applied on top of the upstream commit (cherry-picked, not yet on any upstream branch): ${PATCHNOTE}"
             fi
            echo "- Feedstock commit: \`${GITHUB_SHA}\`"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Channel: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo ""
            echo "## Install"
            echo ""
            echo '```'
            echo "# classic conda — via the static channel"
            echo "conda config --add channels https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            echo "conda install ninfer=${VER}"
            echo '```'
            echo ""
            echo '```'
            echo "# mamba / micromamba — this release's real-name asset, by direct URL"
            echo "# (add -p <prefix> to target a specific environment)"
            echo "mamba install \"https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/v${VER}-${UPSHA:0:7}/ninfer-${VER}-${UPSHA:0:7}.conda\""
            echo '```'
            echo ""
            echo "mamba/micromamba: re-run that line with a newer tag to replace-update. libmamba parses the filename (name/version/build, three dash-segments), so the two-segment \`ninfer-latest.conda\` alias is the stable download URL for scripts only — see the README."
          } > /tmp/release-notes.md
          # --target pins the auto-created tag to exactly the built commit
          # (default would be "main branch head at release time"); the tag
          # NAME carries the upstream hash even though it points here
          gh release create "v${VER}-${UPSHA:0:7}" output/linux-64/*.conda \
            --target "$GITHUB_SHA" \
            --title "NInfer ${VER} (${UPSHA:0:7})" \
            --notes-file /tmp/release-notes.md
          # twin asset with a constant name (same bytes): GitHub's
          # /releases/latest/download/ninfer-latest.conda URL then always
          # serves the newest build — the stable download URL for
          # automation (mamba/micromamba install the per-tag real-name URL
          # from the notes above; libmamba rejects the two-segment alias
          # name — see README). gh release upload names the asset after
          # the local file, so rename first.
          cp output/linux-64/*.conda /tmp/ninfer-latest.conda
          gh release upload "v${VER}-${UPSHA:0:7}" /tmp/ninfer-latest.conda
          echo "tag=v${VER}-${UPSHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Prune old per-build releases (keep newest 3)
        # per-build tags match v<ts>-<upstream-hash7>; versioned tags
        # ([0-9]*...) are never touched. Newest 3 kept => ~1.4 GB
        # release-storage cap.
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t PRUNE < <(
            # gh release list json field is `tagName` (camelCase); requesting
            # `tag_name` errors out and silently prunes nothing (2026-09-04:
            # releases accumulated to 6 because the step no-op'd every run)
            gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}-[0-9a-f]{7}$' \
              | sort | head -n -3
          )
          if [ "${#PRUNE[@]}" -gt 0 ]; then
            for t in "${PRUNE[@]}"; do
              echo "deleting old release ${t} (release + tag, frees asset storage)"
              gh release delete "$t" --cleanup-tag -y
            done
          else
            echo "nothing to prune (<= 3 per-build releases exist)"
          fi

      - name: Publish to Pages channel
        # gh-pages branch = static conda channel; merges this build's
        # repodata entry (pointing at the per-build release just created)
        # with the channel's current ones and drops entries whose release
        # no longer exists (self-heals after pruning)
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_pages_channel.py --mode release --tag "${{ steps.tag.outputs.tag }}"

      - name: Upload run artifact
        if: ${{ steps.skipcheck.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-conda
          path: output/linux-64/*.conda
          retention-days: 30
