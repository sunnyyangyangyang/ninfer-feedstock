# NInfer feedstock recipe.
#
# SHARED SCHEMA: this file is deliberately jinja-free plain YAML so that it
# parses unchanged under BOTH builders:
#   * conda-build  (conda-forge CI; `recipe/meta.yaml` convention)
#   * rattler-build (local builds; passed as `-r recipe/meta.yaml`)
# Consequences of that choice (details in the feedstock README):
#   * no `{% %}`/`{{ }}` jinja, no `# [selectors]`
#   * no top-level `skip:` (not in rattler's strict recipe schema) -> the
#     platform guard lives in build.sh
#   * no `{{ compiler('c') }}` macro -> literal gcc/gxx compiler metas
#   * about uses `homepage:` (accepted by both builders)
#   * the `tests:` section runs under rattler-build; conda-build ignores it
#     and runs run_test.sh from this directory (same smoke test)

package:
  name: ninfer
  version: 0.1.0

source:
  # The upstream repository has no git tags and no in-tree version, so the
  # conda-side version is pinned to an upstream commit. Bump version + url +
  # sha256 + build.string (+ the patches list, if any) together when updating.
  #
  # `patches:` holds upstream commits cherry-picked on top of the pinned
  # source while they are not (yet) on any upstream branch: a commit that
  # only exists as a loose commit object is invisible to the CI's
  # `git ls-remote HEAD` (default-branch HEAD), so without the patch it
  # could sit unshipped for days (2026-09-05: d8e2a27a, committed on top of
  # ad0f3d38, on no branch — every run skipped as "unchanged").
  # continuous-build.yml applies the patch on top of whatever upstream HEAD
  # it fetches, and auto-drops the `patches:` lines below once the fetched
  # HEAD is the patch's own commit sha; at that point bump this pin to that
  # sha and delete the patch file.
  - url: https://github.com/Neroued/ninfer/archive/ad0f3d384b5cbcec4a48a3951c287b4e9831443e.tar.gz
    sha256: 6a0378513a964fd1d039c4ab5b4b075a835622fb95922f119b6f35b330af5078
    # Patch lifecycle: drop the two lines below once Neroued/ninfer's
    # default branch contains d8e2a27a (CI auto-drops them when it re-pins
    # that sha — see .github/workflows/continuous-build.yml).
    patches:
      - patches/0001-d8e2a27a-raise-prompt-vision-envelope-262144.patch

build:
  # Static build string = "<upstream commit7>" — the package identity is
  # name=ninfer, version=<date/ts>, build=<commit7>; no arch suffix
  # (the package hard-rejects every GPU but the RTX 5090 anyway, so
  # sm_120a is implied and kept out of the identity). Defining `string`
  # stops rattler-build from auto-appending its opaque content-fingerprint
  # and build-number tail (`_h<hash>_0`): with a static string the .conda
  # filename and the package `build` field are exactly this string
  # (verified: rattler-build 0.75.0, 2026-09-04). conda-build instead
  # appends the build number (`..._0`) — cosmetic difference only.
  # Keep in sync with the source pin: bump version + url + sha256 + string
  # together. The continuous workflow rewrites this line per run to the
  # built upstream HEAD commit (see .github/workflows/continuous-build.yml).
  string: "ad0f3d3"
  number: 0

requirements:
  # Mirrors the upstream local build environment:
  #   mamba create -c conda-forge cmake>=3.28 ninja gxx_linux-64 pkgconf
  #       ffmpeg libcurl>=7.85 cuda-toolkit=13.*
  # (see the upstream repo's .deps mamba prefix). The gcc/gxx metas track the
  # newest conda-forge toolchain, same behavior as the upstream env. Builder
  # requirement: the prebuilt CUDA 13 libraries (libcudart.so, libcuda.so
  # stubs) carry RHEL-style absolute DT_NEEDED entries (/lib64/libm.so.6,
  # /lib64/libmvec.so.1). Builders without a /lib64 directory (e.g.
  # ubuntu-based CI runners) must provision it first — the feedstock workflow
  # does (see .github/workflows/build-and-release.yml).
  build:
    - gcc
    - gxx
    - cmake >=3.28
    - ninja
    - pkgconf
  host:
    # Full CUDA 13.x toolkit: nvcc + libraries + dev files. The project's
    # find_package(CUDAToolkit) resolves against the conda prefix layout
    # (bin/nvcc + targets/x86_64-linux), same as in the upstream mamba
    # prefix.
    - cuda-toolkit 13.*
    - ffmpeg
    - libcurl >=7.85
  run:
    # ldd on the built binaries shows exactly one CUDA tool library
    # (libcudart.so.13); libcuda.so.1 comes from the system NVIDIA driver
    # and is intentionally not a conda dependency.
    - cuda-cudart 13.*
    - ffmpeg
    - libcurl
    - libstdcxx-ng

# Executed by rattler-build. conda-build ignores this key and instead runs
# run_test.sh from this directory (identical smoke test).
tests:
  - script:
      - $PREFIX/bin/ninfer --help
      - $PREFIX/bin/ninfer-serve --help

about:
  homepage: https://github.com/Neroued/ninfer
  repository: https://github.com/Neroued/ninfer
  license: Apache-2.0
  license_file: LICENSE
  summary: High-performance local LLM inference framework for a single NVIDIA GeForce RTX 5090
  description: |
    NInfer is a high-performance inference framework that runs text, image
    and video prompts on a single NVIDIA GeForce RTX 5090 (sm_120a, CUDA
    13.x). It provides a local CLI (ninfer) and an HTTP server
    (ninfer-serve) with OpenAI/Anthropic-compatible APIs, and ships
    hand-written CUDA kernels for Qwen3.x-family models with INT8/FP8/NVFP4
    quantized weights and INT8/FP8 KV caches.
